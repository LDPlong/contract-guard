[project]
name = "contract-guard-backend"
version = "1.1.0"
description = "ContractGuard backend — 合同风险审查官"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends 默认参数

[tool.ruff.lint.per-file-ignores]
# 脚本与测试里的长字符串（URL、SQL、样例文本）不强制 100 列
"scripts/*" = ["E501"]
"tests/*" = ["E501"]
